[workspace]
resolver = "2"
members = ["core", "host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Karpagam Karthikeyan"]
repository = "https://github.com/KarpagamKarthikeyan/canopen-rs"
rust-version = "1.75"
keywords = ["canopen", "can", "cia301", "embedded", "no_std"]
categories = ["embedded", "no-std", "network-programming"]

[workspace.dependencies]
# The no_std core, depended on by host crates.
canopen-rs = { path = "core", version = "0.1.0" }

# Transport-agnostic CAN frame/id abstraction (no_std).
embedded-can = "0.4"

# Bounded, allocation-free collections for the no_std object dictionary.
heapless = "0.8"

# Linux SocketCAN transport (host only, Linux only).
socketcan = "3.3"
